<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMK WorkBoard</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.sheetjs.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com https://raw.githubusercontent.com; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f9; --surface:#ffffff; --line:#e3e7ef; --line2:#cfd6e2; --text:#0e1a2e; --muted:#5a6a80; --faint:#8b97aa;
  --brand:#1d3b9e; --brand-2:#2f5bea; --brand-soft:#edf1ff; --navy:#0a1a38;
  --ok:#137a3d; --ok-soft:#e6f5ec; --ok-c:#22a05a;
  --warn:#a85a06; --warn-soft:#fdf2e1; --warn-c:#f0a020;
  --bad:#b72424; --bad-soft:#fdeaea; --bad-c:#e04848;
  --grad-brand:linear-gradient(135deg,#0b2a7a 0%,#1f4fd8 55%,#4f8bff 100%);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-md:0 6px 16px rgba(16,24,40,.08);
  --shadow-lg:0 18px 40px rgba(10,26,56,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 500px at 0% 0%,#e6ecff 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#e3f4f7 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.face{flex:none;display:inline-block;vertical-align:middle}
.hidden{display:none!important}

/* ---------- LOCK ---------- */
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 15% 10%,#2443a8 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#0b5566 0%,transparent 60%),var(--navy);transition:opacity .35s ease}
.lock.out{opacity:0;pointer-events:none}
.lock::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,#000 30%,transparent 75%)}
.lock-card{position:relative;width:340px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.98);border-radius:22px;padding:32px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
.logo{display:grid;place-items:center;color:#fff;background:var(--grad-brand);font-weight:800;letter-spacing:.02em;box-shadow:0 8px 20px rgba(47,91,234,.35)}
.lock-card .logo{width:60px;height:60px;border-radius:17px;margin:0 auto 16px;font-size:17px}
.lock-card h1{font-size:20px;font-weight:800;letter-spacing:-.015em}
.lock-card h1 span{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.lock-card p{color:var(--muted);font-size:13px;margin-top:4px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:24px 0 22px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:all .15s}
.pin-dots span.on{background:var(--brand-2);border-color:var(--brand-2)}
.pin-dots.err span{border-color:var(--bad-c);background:var(--bad-c)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:54px;border-radius:12px;background:#f3f5fa;font-size:20px;font-weight:600;transition:background .12s,transform .08s;display:grid;place-items:center}
.key:hover{background:#e8ecf5}
.key:active{transform:scale(.96);background:#dde3f0}
.key.blank{visibility:hidden}
.lock-msg{height:18px;margin-top:14px;font-size:12.5px;color:var(--bad);font-weight:500}
.lock-foot{margin-top:6px;font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center;justify-content:center}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:11px;font-size:12px}
.brand-t{font-weight:800;font-size:16px;letter-spacing:-.015em;white-space:nowrap}
.brand-t span{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:16px;border-left:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.crumb b{color:var(--text)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.sync .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.synced .d{background:var(--ok-c);box-shadow:0 0 0 3px rgba(34,160,90,.18)}
.sync.saving .d,.sync.pending .d{background:var(--warn-c);animation:pulse 1s infinite}
.sync.error{color:var(--bad);border-color:#f3c9c9;background:var(--bad-soft)}
.sync.error .d{background:var(--bad-c)}
.sync.readonly .d{background:var(--brand-2)}
@keyframes pulse{50%{opacity:.35}}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#fff;transition:all .12s}
.icon-btn:hover{color:var(--text);background:#f5f7fb;border-color:var(--line2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.primary{background:var(--grad-brand);color:#fff;box-shadow:0 4px 12px rgba(31,79,216,.28)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 6px 16px rgba(31,79,216,.35)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:#f6f8fb;border-color:var(--line2)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.soft:hover{background:#e2e8ff}
.btn.danger{color:var(--bad);background:#fff;border:1px solid #f1d0d0}
.btn.danger:hover{background:var(--bad-soft)}
.btn.white{background:var(--glass);color:var(--on);border:1px solid rgba(255,255,255,.8)}
.btn.white:hover{background:#fff}

.page{max-width:1440px;margin:0 auto;padding:28px 24px 64px}

/* ---------- HOME ---------- */
.hello{margin:6px 0 22px}
.hello .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}
.hello h2{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:4px}
.hello p{color:var(--muted);margin-top:4px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pick{position:relative;overflow:hidden;border-radius:22px;padding:24px 24px 20px;color:var(--on,#fff);border:1px solid rgba(255,255,255,.7);background:var(--g);cursor:pointer;box-shadow:0 14px 34px var(--gs);transition:transform .18s,box-shadow .18s;min-height:300px;display:flex;flex-direction:column}
.pick:hover{transform:translateY(-3px);box-shadow:0 20px 44px var(--gs)}
.pick::before{content:"";position:absolute;width:380px;height:380px;right:-120px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%)}
.pick::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.3px);background-size:18px 18px;mask-image:linear-gradient(120deg,transparent 30%,#000 100%);pointer-events:none}
.pick > *{position:relative;z-index:1}
.pick-top{display:flex;align-items:flex-start;gap:14px}
.pick-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--gb);box-shadow:0 6px 14px var(--gs)}
.pick-name{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pick-sub{font-size:13px;color:var(--mute);margin-top:3px;font-weight:500}
.pick-top .zone{margin-left:auto}
.zone{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 5px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--text);font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.zone.none{padding-left:12px}
.pick-mid{display:flex;align-items:center;gap:22px;margin-top:14px;flex:1}
.pick .gauge{width:200px}
.pick .g-track,.hero .g-track{stroke:var(--trk)}
.pick .g-num,.hero .g-num{fill:var(--on)}
.pick .g-pct,.pick .g-cap,.hero .g-pct,.hero .g-cap{fill:var(--mute)}
.pick .g-tick,.hero .g-tick{stroke:var(--mute);opacity:.5}
.pick-stats{flex:1;display:flex;flex-direction:column;gap:9px}
.ps-row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;padding:6px 10px 6px 6px;border-radius:12px;background:var(--glass,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.6)}
.ps-row .lb{flex:1;opacity:.92}
.ps-row .v{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pick-foot{display:flex;align-items:center;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}
.pk .n{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pk .l{font-size:11.5px;color:var(--mute);font-weight:500}
.pick-go{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;background:var(--gb);color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.15);transition:gap .15s}
.pick:hover .pick-go{gap:12px}
.rep-strip{margin-top:20px;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap;position:relative;overflow:hidden}
.rep-strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad-brand)}
.rs-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--grad-brand);box-shadow:0 6px 14px rgba(31,79,216,.28)}
.rs-t{font-weight:700;font-size:15px}
.rs-s{font-size:12.5px;color:var(--muted)}
.rep-strip .acts{margin-left:auto;display:flex;gap:8px}

/* ---------- TEAM PAGE ---------- */
.team-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px;color:var(--on,#fff);border:1px solid rgba(255,255,255,.7);background:var(--g);box-shadow:0 14px 34px var(--gs);display:grid;grid-template-columns:minmax(220px,1fr) 220px minmax(260px,1.1fr);gap:24px;align-items:center;margin-bottom:20px}
.hero::before{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.3px);background-size:18px 18px;mask-image:linear-gradient(120deg,transparent 30%,#000 100%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .pick-name{font-size:28px}
.hero .zone{margin-top:14px}
.hero .gauge{width:220px}
.hero-kpis{display:flex;gap:22px;margin-top:16px}
.gauge-svg{width:100%;display:block}
.g-track{fill:none;stroke:#edf0f5;stroke-width:16;stroke-linecap:round}
.g-val{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke .3s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.g-tick{stroke:#c3cad6;stroke-width:2;stroke-linecap:round}
.g-num{font-size:34px;font-weight:800;fill:var(--text);text-anchor:middle;letter-spacing:-.03em}
.g-pct{font-size:18px;font-weight:700;fill:var(--muted)}
.g-cap{font-size:11px;fill:var(--faint);text-anchor:middle;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.ph-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--gb)}
.count{font-size:12px;font-weight:600;color:var(--muted);background:#f1f4f9;border-radius:999px;padding:3px 9px}
.ph-search{position:relative;width:280px;margin-left:auto}
.ph-search input{width:100%;height:34px;border:1px solid var(--line);background:#f6f8fb;border-radius:9px;padding:0 12px 0 34px;outline:none;transition:all .15s;font-size:13px}
.ph-search input:focus{background:#fff;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,91,234,.12)}
.ph-search .ic{position:absolute;left:11px;top:9px;color:var(--faint)}
.ph-actions{display:flex;gap:8px}
.tree-scroll{padding:22px 20px 26px;background:radial-gradient(circle,#dde3ee 1px,transparent 1.2px) 0 0/22px 22px,#fbfcfe}
.tree{display:flex;flex-direction:column;align-items:stretch}
.node-root{position:relative;display:flex;justify-content:center;padding-bottom:22px}
.node-root.solo{padding-bottom:0}
.node-root::after{content:"";position:absolute;left:50%;bottom:0;height:22px;border-left:2px solid var(--line2)}
.node-root.solo::after{display:none}
.root-card{display:flex;align-items:center;gap:12px;padding:12px 20px 12px 12px;border-radius:15px;color:var(--on,#fff);background:var(--g);box-shadow:0 10px 24px var(--gs);border:1px solid rgba(255,255,255,.7)}
.root-card .ri{width:38px;height:38px;border-radius:10px;background:var(--gb);color:#fff;display:grid;place-items:center}
.root-card .rt{font-weight:700;font-size:15px}
.root-card .rs{font-size:12px;color:var(--mute);font-weight:500}
.branches{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start;padding-top:20px;border-top:2px solid var(--line2);border-radius:14px 14px 0 0}
.branches::before,.branches::after{content:"";position:absolute;top:-2px;width:2px;height:12px;background:var(--line2)}
.branches::before{left:0}.branches::after{right:0}
.vt{display:inline-flex;background:#eef1f6;padding:3px;border-radius:10px;gap:2px}
.vt button{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.vt button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.vt .count{padding:1px 7px;font-size:11px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cc{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 16px 13px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gb)}
.cc:hover{box-shadow:var(--shadow-md);border-color:var(--line2)}
.cc.hit{border-color:#f4c56a;box-shadow:0 0 0 3px rgba(240,160,32,.15)}
.cc-top{display:flex;align-items:center;gap:12px}
.cc-logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:var(--gb);flex:none}
.cc-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-sub{font-size:12px;color:var(--muted)}
.cc-n{margin-left:auto;text-align:right;flex:none}
.cc-n b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cc-n span{font-size:11px;color:var(--muted);font-weight:600}
.cc-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0}
.cc-line .ic{color:var(--faint);flex:none}
.cc-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-line b{color:var(--text);font-weight:600}
.cc-mix{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#eef1f6;gap:2px}
.cc-mix i{display:block;height:100%}
.cc-empty{text-align:center;padding:40px 10px;color:var(--muted)}
.drawer.wide{width:620px}
.cd-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cd-sum div{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fbfcfe}
.cd-sum b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.cd-sum span{font-size:11.5px;color:var(--muted)}
.cd-grp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.cd-gh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(90deg,var(--sbg,#f5f7ff),#fff);cursor:pointer}
.cd-gh .avatar{width:32px;height:32px;font-size:12px;margin:0}
.cd-gh .nm{font-weight:700;font-size:13.5px;flex:1}
.cf-row{display:grid;grid-template-columns:110px 74px 1fr;gap:10px;align-items:start;padding:9px 12px;border-top:1px solid #eef1f6;font-size:12.5px;cursor:default;transition:background .12s}
.cf-row:hover{background:#f8faff}
.cf-row .rchips{gap:3px}
.cf-c{color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:4px}
.mc{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s,border-color .15s,opacity .2s}
.mc:hover{box-shadow:var(--shadow-md);border-color:var(--line2)}
.mc.dim{opacity:.3}
.mc .bar{position:absolute;left:0;right:0;top:0;height:4px;background:var(--sgrad)}
.mc-top{display:flex;align-items:center;gap:11px;padding:16px 12px 10px 14px;background:linear-gradient(180deg,var(--sbg),#fff);cursor:pointer}
.mc-top .avatar{width:42px;height:42px;font-size:14px;margin:0;flex:none}
.mc-who{flex:1;min-width:0}
.m-name{font-weight:700;font-size:14.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-status{font-size:11.5px;font-weight:700;color:var(--st)}
.s-available{--sc:var(--ok-c);--sbg:#edf9f2;--sgrad:linear-gradient(90deg,#16a34a,#4ade80)}
.s-limited{--sc:var(--warn-c);--sbg:#fff6e6;--sgrad:linear-gradient(90deg,#ea8a00,#fbbf24)}
.s-occupied{--sc:var(--bad-c);--sbg:#fdf0f0;--sgrad:linear-gradient(90deg,#dc2626,#fb7185)}
.m-edit{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s,color .12s}
.m-edit:hover{background:var(--brand-soft);color:var(--brand-2)}
.avatar{position:relative;width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:var(--av);letter-spacing:.02em;box-shadow:0 4px 10px rgba(16,24,40,.16),inset 0 1px 0 rgba(255,255,255,.25)}
.avatar .af{position:absolute;right:-4px;bottom:-4px;border-radius:50%;background:#fff;padding:1.5px;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mc-mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 10px 14px}
.mc-stats{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:500}
.mc-stats span{display:flex;align-items:center;gap:4px}
.face-tog{display:flex;align-items:center;gap:2px;background:#f2f4f8;border-radius:999px;padding:2px}
.face-tog button{width:30px;height:24px;border-radius:999px;display:grid;place-items:center;transition:background .12s,box-shadow .12s}
.face-tog button .face{filter:grayscale(1);opacity:.45;transition:filter .12s,opacity .12s}
.face-tog button:hover .face{filter:none;opacity:.85}
.face-tog button.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.18)}
.face-tog button.on .face{filter:none;opacity:1}
.mc-clients{border-top:1px solid var(--line);padding:6px}
.leaf{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
.leaf:hover{background:#f4f6fb}
.leaf.hit{background:#fff4e2;box-shadow:inset 0 0 0 1px #f4c56a}
.leaf .l-ic{width:26px;height:26px;border-radius:7px}
.l-ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;background:var(--gb,var(--grad-brand))}
.leaf .l-txt{min-width:0;flex:1}
.leaf .l-name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf .l-work{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf .l-n{font-size:11px;font-weight:700;color:var(--muted);background:#f1f4f9;border-radius:6px;padding:2px 6px;flex:none}
.leaf.empty{justify-content:center;color:var(--muted);font-size:12px;border:1.5px dashed var(--line2);margin:2px}
.mc-more{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px;margin-top:2px;border-radius:8px;font-size:12px;font-weight:600;color:var(--brand-2)}
.mc-more:hover{background:var(--brand-soft)}
.mc-more .ic{transition:transform .2s}
.mc-more.up .ic{transform:rotate(180deg)}
.empty-tree{text-align:center;padding:30px 10px 10px;color:var(--muted)}
.empty-tree .et-ic{width:54px;height:54px;border-radius:15px;margin:0 auto 12px;display:grid;place-items:center;color:#fff;background:var(--gb)}
.empty-tree b{display:block;color:var(--text);font-size:14px;margin-bottom:3px}
.empty-tree .btn{margin-top:14px}

/* chips */
.rchip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--rc-bg,#eef2ff);color:var(--rc,#1d3b9e);white-space:nowrap}
.rchips{display:flex;flex-wrap:wrap;gap:4px}
.fid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:12.5px;background:#f1f4f9;border:1px solid var(--line);padding:1px 7px;border-radius:6px;white-space:nowrap}

/* ---------- TOOLTIP ---------- */
.tip{position:fixed;z-index:60;max-height:calc(100vh - 16px);overflow:hidden;width:300px;background:linear-gradient(160deg,#13244a,#0c1830);color:#e9eefb;border-radius:14px;padding:13px 14px;box-shadow:var(--shadow-lg);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:12.5px}
.tip.show{opacity:1;transform:none}
.tip h4{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.tip .tl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#93a3c4;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:9px}
.tip .tv{white-space:pre-wrap;margin-top:3px;color:#e3e9f7}
.tip .tf{display:flex;align-items:flex-start;gap:8px;margin-top:7px}
.tip .tf .ctry{display:flex;margin-bottom:3px}
.tip .tf .fid{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#fff}
.tip .rchip{background:rgba(255,255,255,.12);color:#dbe4ff}
.tip .cls{background:#22c3d6;color:#062a33}
.tip .ctry{color:#c9d4ee}
.tip .ctry .ic{color:#8798ba}
.tip .th{margin-top:10px;font-size:11px;color:#8798ba;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}

/* ---------- DRAWER ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,40,.32);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:500px;max-width:100vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.d-head{position:relative;padding:20px 22px 18px;display:flex;gap:14px;align-items:flex-start;color:var(--on,#fff);background:var(--g);border-bottom:1px solid rgba(0,0,0,.06)}
.d-head .avatar{width:56px;height:56px;font-size:19px;margin:0;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.d-who{flex:1;min-width:0}
.d-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
.d-role{font-size:12.5px;color:var(--mute);font-weight:500}
.d-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:7px;background:var(--glass);color:var(--on);font-size:11.5px;font-weight:600;border:1px solid rgba(255,255,255,.7)}
.d-head .x-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--on);background:var(--glass)}
.d-head .x-btn:hover{background:#fff}
.d-body{flex:1;overflow-y:auto;padding:18px 22px 24px}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fbfcfe}
.d-foot .sp{flex:1}
.sec-t{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:4px 0 10px}
.sec-t .count{margin-left:auto;text-transform:none;letter-spacing:0}
.bw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.bw button{border:1.5px solid var(--line);border-radius:14px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s;background:#fff}
.bw button .face{filter:grayscale(1);opacity:.5;transition:all .15s}
.bw button:hover{border-color:var(--line2)}
.bw button:hover .face{filter:none;opacity:.85}
.bw button.on .face{filter:none;opacity:1;transform:scale(1.06)}
.bw button.on.available{border-color:var(--ok-c);background:linear-gradient(180deg,#effaf3,#fff);color:var(--ok);box-shadow:0 6px 14px rgba(34,160,90,.15)}
.bw button.on.limited{border-color:var(--warn-c);background:linear-gradient(180deg,#fff6e6,#fff);color:var(--warn);box-shadow:0 6px 14px rgba(240,160,32,.15)}
.bw button.on.occupied{border-color:var(--bad-c);background:linear-gradient(180deg,#fff0f0,#fff);color:var(--bad);box-shadow:0 6px 14px rgba(224,72,72,.15)}
.c-list{display:flex;flex-direction:column;gap:12px}
.c-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:all .3s;background:#fff}
.c-card.focus{border-color:#9fb3f0;box-shadow:0 0 0 4px rgba(47,91,234,.1)}
.c-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(90deg,#faf6ef,#fff)}
.c-name{font-weight:700;font-size:14px;flex:1;min-width:0}
.f-table{width:100%;border-collapse:collapse;font-size:13px}
.f-table th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:8px 14px 6px;border-top:1px solid var(--line)}
.f-table td{padding:8px 14px;border-top:1px solid #f0f2f6;vertical-align:top}
.f-table td:first-child{width:105px}
.f-table td:nth-child(2){width:78px}
.f-table td:nth-child(3){width:110px}
.f-table th,.f-table td{padding-left:10px;padding-right:10px}
.c-rem{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;background:#fcfcfe}
.c-rem .lbl{color:var(--faint);font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px;flex:none}
.c-rem .val{white-space:pre-wrap;word-break:break-word}
.na{color:var(--faint)}
.d-empty{border:1.5px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
.d-updated{margin-top:18px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* forms */
.f{margin-bottom:12px}
.f label,.lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s;font-size:13.5px}
.f textarea{resize:vertical;min-height:58px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,91,234,.12)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.ce{border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;background:linear-gradient(180deg,#f7f9ff,#fbfcfe 60%);margin-bottom:12px}
.ce-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--brand)}
.ce-h .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.ce-h .x:hover{background:var(--bad-soft);color:var(--bad)}
.fund{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 10px 4px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.fund-top{display:grid;grid-template-columns:1fr 1fr 28px;gap:8px;align-items:start;margin-bottom:8px}
.fund-top .x{margin-top:21px}
.fund .lab{font-size:11.5px;margin-bottom:4px}
.fund .inp{padding:8px 10px;font-size:13px}
.fund select.inp{height:36px;padding:0 8px}
.freq{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;background:#eef1f6;color:#334155}
.freq.f-daily{background:#fde8e8;color:#9b1c1c}.freq.f-weekly{background:#e6f0ff;color:#1d3b9e}.freq.f-monthly{background:#e7f6ec;color:#146c37}
.fund .x{width:28px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.fund .x:hover{background:var(--bad-soft);color:var(--bad)}
.fund-sec{margin-bottom:8px}
.fund-cls{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px 10px;border-radius:10px;background:linear-gradient(90deg,#e8f6f8,#fff);border:1px dashed #9fd3dc;animation:pop .2s ease}
.fund-cls .lab{margin:0;flex:1;color:#0b6475;font-weight:700;display:flex;align-items:center;gap:6px}
.fund-cls .inp{width:110px}
.cls{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:#0b6475;color:#fff;white-space:nowrap}
.ctry{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;white-space:nowrap}
.ctry .ic{color:var(--faint)}
.add-fund{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand-2);padding:4px 6px;border-radius:7px;margin-bottom:10px}
.add-fund:hover{background:var(--brand-soft)}
.ms{position:relative}
.ms-btn{width:100%;min-height:36px;border:1px solid var(--line2);border-radius:9px;background:#fff;padding:5px 30px 5px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;text-align:left;position:relative}
.ms-btn .ph{color:var(--faint);font-size:13px;padding-left:3px}
.ms-btn > .ic{position:absolute;right:9px;top:10px;color:var(--faint)}
.ms.open .ms-btn{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,91,234,.12)}
.ms-pop{display:none;position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.ms.open .ms-pop{display:block}
.ms-opts{max-height:240px;overflow-y:auto}
.ms-opt{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.ms-opt:hover{background:#f4f6fb}
.ms-opt input{width:16px;height:16px;accent-color:var(--brand-2)}
.ms-new{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);margin-top:4px}
.ms-new .inp{padding:7px 9px;font-size:12.5px}
.add-row{width:100%;border:1.5px dashed var(--line2);border-radius:12px;padding:11px;color:var(--brand-2);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff}
.add-row:hover{background:var(--brand-soft);border-color:#b9c7f3}

/* ---------- MODAL ---------- */
.modal-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.42);padding:16px;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-wrap.show{opacity:1;pointer-events:auto}
.modal{width:520px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);transform:scale(.97);transition:transform .15s}
.modal-wrap.show .modal{transform:none}
.modal.sm{width:400px}
.modal.xl{width:1280px;height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh .m-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--grad-brand)}
.mh h3{font-size:16px;font-weight:700}
.mh p{font-size:12.5px;color:var(--muted)}
.mh .icon-btn{margin-left:auto;border:0}
.mb{padding:18px 20px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fbfcfe}
.note{font-size:12.5px;color:var(--muted);background:#f5f7fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.note b{color:var(--text)}
.note ol{padding-left:18px;margin-top:4px}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin:4px 0 12px}
.conn.ok{color:var(--ok)} .conn.bad{color:var(--bad)} .conn.wait{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:18px 0}
.types-list{display:flex;flex-wrap:wrap;gap:6px}
.act-row{display:grid;grid-template-columns:120px 130px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.act-t{color:var(--faint);font-variant-numeric:tabular-nums}
.act-b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.types-list .rchip{gap:5px;height:26px}

/* report viewer */
.rep-head{background:var(--grad-brand);color:#fff;border-bottom:0}
.rep-head p{color:rgba(255,255,255,.8)}
.rep-head .m-ic{background:rgba(255,255,255,.18)}
.rep-head .icon-btn{color:#fff;background:rgba(255,255,255,.14)}
.rep-head .icon-btn:hover{background:rgba(255,255,255,.26);color:#fff}
.rep-tool{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fbfcfe}
.seg{display:inline-flex;background:#e9edf4;padding:3px;border-radius:10px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .12s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.rep-tool select,.rep-tool input{height:34px;border:1px solid var(--line2);border-radius:9px;padding:0 10px;background:#fff;font-size:13px;outline:none}
.rep-tool input{width:150px}
.rep-tool select{max-width:150px}
.rep-tool{gap:8px}
.rep-tool .sp{flex:1}
.rep-kpis{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.rk{padding:8px 14px;border-radius:12px;background:#f5f7fb;border:1px solid var(--line);min-width:96px}
.rk .n{font-size:18px;font-weight:800;letter-spacing:-.02em}
.rk .l{font-size:11.5px;color:var(--muted)}
.rk.g{background:var(--grad-brand);color:#fff;border:0}
.rk.g .l{color:rgba(255,255,255,.8)}
.rep-scroll{flex:1;overflow:auto}
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.rt th{position:sticky;top:0;z-index:1;background:#f3f5fa;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:9px 12px;border-bottom:1px solid #eef1f6;vertical-align:top}
.rt tr.grp td{border-top:2px solid #e3e7ef}
.rt tbody tr:hover td{background:#f8faff}
.rt .rep{color:#b0b9c8}
.rt .mem{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.rt .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rt td.c0{color:#c4cbd6}
.team-pill{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:700;background:var(--gb);white-space:nowrap}
.rep-empty{text-align:center;padding:50px;color:var(--muted)}

/* ---------- TOAST ---------- */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f1d38;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:tin .2s ease}
.toast .ic{color:#6ee7a0}
.toast.err .ic{color:#ff8a8a}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr 200px}
  .hero .hero-stats{grid-column:1/-1}
}
@media (max-width:900px){
  .picks{grid-template-columns:1fr}
  .crumb{display:none}
  .ph-search{width:100%;order:3}
}
@media (max-width:640px){
  .topbar-in{padding:0 12px;gap:8px}
  .brand-s{display:none}
  .sync .t{display:none}
  .page{padding:18px 12px 48px}
  .pick-mid,.hero{grid-template-columns:1fr;display:flex;flex-direction:column;align-items:stretch}
  .pick .gauge,.hero .gauge{margin:0 auto}
  .g2{grid-template-columns:1fr}
  .rep-strip .acts{margin-left:0;width:100%}
  .top-actions .btn .t{display:none}
}
@media print{
  body{background:#fff}
  body > *:not(#modalWrap){display:none!important}
  .modal-wrap{position:static;background:none;padding:0;opacity:1}
  .modal.xl{width:auto;height:auto;box-shadow:none;overflow:visible;border-radius:0}
  .rep-tool,.rep-head .icon-btn{display:none!important}
  .rep-head{background:#fff;color:#000;border-bottom:2px solid #000}
  .rep-head p{color:#444}
  .rep-scroll{overflow:visible}
  .rt th{position:static}
  .rk{border:1px solid #ccc}
}
</style>
</head>
<body>
<!-- shared gradients for face icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fg-ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <linearGradient id="fg-warn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#e07a00"/></linearGradient>
    <linearGradient id="fg-bad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#c81e1e"/></linearGradient>
  </defs>
</svg>

<!-- ============ LOCK ============ -->
<div class="lock" id="lock">
  <div class="lock-card" id="lockCard">
    <div class="logo">GMK</div>
    <h1>GMK <span>WorkBoard</span></h1>
    <p>Enter your 4-digit PIN to continue</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="keypad" id="keypad"></div>
    <div class="lock-msg" id="lockMsg"></div>
    <div class="lock-foot"><span data-icon="lock" data-size="12"></span> Encrypted · Authorised GMK team members only</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-in">

    reportTypes: cleanList(d.reportTypes), countries: cleanList(d.countries), teams: [],

  if (!out.reportTypes.length) out.reportTypes = [...CONFIG.defaultReportTypes];
  if (!out.countries.length) out.countries = [...CONFIG.defaultCountries];

          funds: (Array.isArray(c.funds) ? c.funds : []).slice(0, 200).filter(f => f && typeof f === 'object').map(f => {
            const cls = parseInt(f.classes);
            return { id: safeId(f.id), fundId: clean(f.fundId, 40),
              frequency: CONFIG.frequencies.includes(f.frequency) ? f.frequency : '',

              reports: cleanList(f.reports), classes: cls > 0 ? Math.min(cls, 9999) : '' };
          }) };

    })) });

}

const clientReports = c => [...new Set(c.funds.flatMap(f => f.reports))];

/* ===================== SECURITY / CRYPTO ===================== */
// PIN -> PBKDF2 (310k iterations) -> AES-256-GCM key. The access key and the local data cache are
// stored ONLY in encrypted form; nothing readable is left in the browser when the board is locked.
const session = { key: null, token: '', name: '', pin: '', conn: null };
const te = new TextEncoder(), td = new TextDecoder();

const OK_NAME = /^[A-Za-z0-9_.-]{1,100}$/, OK_PATH = /^[A-Za-z0-9_\/.-]{1,200}\.json$/;
function gh(over) {
  const saved = over || session.conn || {};
  const c = { ...CONFIG.github };
  ['owner', 'repo', 'branch', 'path'].forEach(k => { if (saved[k]) c[k] = saved[k]; });
  if (!c.owner && location.hostname.endsWith('.github.io')) c.owner = location.hostname.split('.')[0];
  c.token = over && over.token !== undefined ? over.token : session.token;
  return c;
}
function validConn(c) {
  if (!OK_NAME.test(c.owner) || !OK_NAME.test(c.repo) || !OK_NAME.test(c.branch) || !OK_PATH.test(c.path) || c.path.includes('..')) throw new Error('Repository details contain invalid characters');
  if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(c.token)) throw new Error('That does not look like a GitHub access key');
}
const mode = () => { const c = gh(); return c.owner && c.repo && c.token ? 'live' : 'local'; };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
function b64enc(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64) { const bin = atob(b64.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

async function ghGet(c = gh()) {
  validConn(c);
  {
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(c.path)}?ref=${encodeURIComponent(c.branch)}`;
    const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${c.token}` }, cache: 'no-store' });
    if (r.status === 404) return { sha: null, data: null };
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); }
    const j = await r.json();
    const text = j.content ? b64dec(j.content) : await (await fetch(j.download_url, { cache: 'no-store' })).text();
    if (text.length > 8e6) throw new Error('Data file is unexpectedly large — refusing to load');
    return { sha: j.sha, data: JSON.parse(text) };
  }
}
async function ghPut(payload, sha, c = gh()) {
  validConn(c);
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(c.path)}`;
  const body = { message: `WorkBoard update by ${(session.name || 'team member').replace(/[^\w .-]/g, '')} · ${new Date().toLocaleString('en-IN')}`, content: b64enc(JSON.stringify(payload, null, 2)), branch: c.branch };
  if (sha) body.sha = sha;
  const r = await fetch(url, { method: 'PUT', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${c.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409) return { conflict: true };
  if (r.status === 422) { const j = await r.json().catch(() => ({})); if (/sha|match|conflict/i.test(j.message || '')) return { conflict: true }; throw new Error(`GitHub 422: ${j.message}`); }

  if (r.status === 401) throw new Error('The access key is invalid or was deleted — create a new one and redo Team sync setup');
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); }

}

}

function commit(op, msg) {

function stats(t) {

  t.members.forEach(m => c[m.status]++);
  const n = t.members.length;
  const load = n ? Math.round((c.occupied + c.limited * 0.5) / n * 100) : 0;
  const zone = !n ? 'none' : load <= 35 ? 'ok' : load <= 70 ? 'warn' : 'bad';
  const label = { none: 'No members yet', ok: 'Bandwidth available', warn: 'Limited bandwidth', bad: 'At full capacity' }[zone];
  const zface = { ok: 'available', warn: 'limited', bad: 'occupied' }[zone];
  const clients = t.members.reduce((a, m) => a + m.clients.length, 0);
  const funds = t.members.reduce((a, m) => a + m.clients.reduce((b, c) => b + c.funds.length, 0), 0);
  return { c, n, load, zone, label, zface, clients, funds };
}

  const tick = p => { const th = Math.PI - p / 100 * Math.PI; const f = r => [(100 + r * Math.cos(th)).toFixed(1), (100 - r * Math.sin(th)).toFixed(1)]; const [x1, y1] = f(92), [x2, y2] = f(98); return `<line class="g-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; };
  return `<svg viewBox="0 0 200 118" class="gauge-svg" role="img" aria-label="${load}% capacity used">

    <path d="M20 100 A80 80 0 0 1 180 100" pathLength="100" class="g-val" style="stroke:${col};stroke-dasharray:${load > 0 ? load : 0.001} 100;${load > 0 ? '' : 'opacity:0'}"/>

    <text x="100" y="112" class="g-cap">capacity used</text></svg>`;
}

      const mr = [];
      if (!m.clients.length) mr.push({ ...base, client: '', fundId: '', frequency: '', countries: [], reports: [], classes: '', remarks: '' });
      m.clients.forEach(c => {
        if (!c.funds.length) mr.push({ ...base, client: c.name, fundId: '', frequency: '', countries: [], reports: [], classes: '', remarks: c.remarks });
        c.funds.forEach(fd => mr.push({ ...base, client: c.name, fundId: fd.fundId, frequency: fd.frequency, countries: fd.countries, reports: fd.reports, classes: fd.classes, remarks: c.remarks }));

async function genTeamKey() {
  const st = $('#k-state');
  const conn = { owner: $('#k-owner').value.trim(), repo: $('#k-repo').value.trim() || 'workboard-data', branch: CONFIG.github.branch, path: CONFIG.github.path };
  const token = $('#k-token').value.trim();
  st.className = 'conn wait'; st.innerHTML = ic('refresh', 15) + ' Checking access…';
  try {
    if (!conn.owner) throw new Error('Enter your GitHub username');
    const c = gh({ ...conn, token }); validConn(c);
    const repo = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}` }, cache: 'no-store' });
    if (repo.status === 401) throw new Error('GitHub did not accept this access key — check it was copied fully');
    if (!repo.ok) throw new Error(`Repo "${c.owner}/${c.repo}" not found, or the key was not given access to it`);
    const rj = await repo.json(); if (rj.size === 0 && !rj.default_branch) throw new Error('The repo is empty — add a README file to it first');
    const r = await ghGet(c);
    st.innerHTML = ic('refresh', 15) + ' Testing save permission…';
    const base = r.data ? normalize(r.data) : clone(data);
    if (!r.data) stamp(base);
    await ghPut(base, r.sha, c);   // proves the key can WRITE, not just read
    const code = await lockTeamKey(session.pin, { t: token, ...conn });
    localStorage.setItem(K.teamKey, code);
    session.token = token; session.conn = conn;
    if (r.data) { data = normalize(r.data); saveLocal(); render(); }
    lastSync = new Date(); setSync('synced');
    st.className = 'conn ok'; st.innerHTML = ic('check', 15) + ' Connected. Team sync is now ON on this device.';
    $('#k-code').value = `  teamKey: '${code}',`; $('#k-out').classList.remove('hidden');
  } catch (err) { st.className = 'conn bad'; st.innerHTML = ic('alert', 15) + ' ' + esc(err.message); }
}

  const log = data.log || [];
  openModal(`
    <div class="mh"><div class="m-ic">${ic('clock', 18)}</div><div><h3>Activity log</h3><p>Who changed what — last ${log.length} updates</p></div><button class="icon-btn" data-act="close-modal">${ic('x', 18)}</button></div>
    <div class="mb" style="padding-top:8px">${log.length ? log.map(l => `<div class="act-row"><span class="act-t">${fmt(l.at)}</span><span class="act-b">${esc(l.by)}</span><span class="act-m">${esc(l.msg)}</span></div>`).join('') : '<div class="rep-empty">No activity yet.</div>'}
    <div class="note" style="margin-top:12px">The full history of every save is also kept in the GitHub repository's commit history, where any earlier version can be restored.</div></div>`);
}
async function importFile(inp) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 3e6) { toast('File too large (max 3 MB)', true); inp.value = ''; return; }
  try {
    const d = normalize(JSON.parse(await f.text()));
    if (!canEdit()) return;
    if (!(await confirmBox('Replace all data?', 'The imported file will replace the current WorkBoard data for everyone.', 'Import'))) return;
    commit(dd => { dd.teams = clone(d.teams); dd.reportTypes = clone(d.reportTypes); dd.countries = clone(d.countries); }, 'Data imported from backup file');
    inp.value = '';
  } catch (err) { toast('Invalid file: ' + err.message, true); }
}

/* ===================== TOOLTIP ===================== */
let tipTimer;
function showTip(leaf) {
  const f = findMember(data, leaf.dataset.id); if (!f) return;
  const c = f.m.clients.find(x => x.id === leaf.dataset.cid); if (!c) return;
  const tip = $('#tip');
  tip.innerHTML = `<h4>${ic('building', 14)} ${esc(c.name || 'Untitled client')}</h4>
    <div class="tl">${ic('hash', 12)} Funds & reports</div>
    ${c.funds.length ? c.funds.map(fd => `<div class="tf"><span class="fid">${esc(fd.fundId || '—')}</span><div>${fd.frequency ? `<div class="ctry">${ic('clock', 12)} ${esc(fd.frequency)}</div>` : ''}${fd.countries.length ? `<div class="ctry">${ic('globe', 12)} ${esc(fd.countries.join(', '))}</div>` : ''}${repChips(fd, true)}</div></div>`).join('') : '<div class="tv">—</div>'}
    <div class="tl">${ic('msg', 12)} Remarks</div><div class="tv">${esc(c.remarks || '—')}</div>
    <div class="th">Click to open · handled by ${esc(f.m.name)}</div>`;
  const r = leaf.getBoundingClientRect(), w = 300;
  let x = r.right + 10; if (x + w > innerWidth - 8) x = r.left - w - 10; if (x < 8) x = 8;
  tip.style.left = x + 'px'; tip.style.top = '0px'; tip.classList.add('show');
  const h = tip.offsetHeight; let y = r.top + r.height / 2 - h / 2; y = Math.max(8, Math.min(y, innerHeight - h - 8));
  tip.style.top = y + 'px';
}
function hideTip() { clearTimeout(tipTimer); $('#tip').classList.remove('show'); }
function placeTip(el, html) {
  const tip = $('#tip'); tip.innerHTML = html;
  const r = el.getBoundingClientRect(), w = 300;
  let x = r.right + 10; if (x + w > innerWidth - 8) x = r.left - w - 10; if (x < 8) x = 8;
  tip.style.left = x + 'px'; tip.style.top = '0px'; tip.classList.add('show');
  const h = tip.offsetHeight; let y = r.top + r.height / 2 - h / 2; y = Math.max(8, Math.min(y, innerHeight - h - 8)); tip.style.top = y + 'px';
}
function showClientTip(card) {
  const g = clientIndex(ui.page).find(x => x.key === card.dataset.key); if (!g) return;
  const shown = g.funds.slice(0, 10);
  placeTip(card, `<h4>${ic('building', 14)} ${esc(g.name)}</h4>
    <div class="tl">${ic('globe', 12)} Countries</div><div class="tv">${esc(g.countries.join(', ') || '—')}</div>
    <div class="tl">${ic('hash', 12)} Funds (${g.funds.length})</div>
    ${shown.map(f => `<div class="tf"><span class="fid">${esc(f.fundId || '—')}</span><div><div class="ctry">${esc(f.member)}${f.countries.length ? ' · ' + esc(f.countries.join(', ')) : ''}</div></div></div>`).join('')}
    ${g.funds.length > 10 ? `<div class="tv" style="color:#8798ba;margin-top:4px">+ ${g.funds.length - 10} more</div>` : ''}
    <div class="th">Click to see all funds</div>`);
}
function showFundTip(row) {
  const [tid, mid, fid] = row.dataset.tipfund.split('|');
  const fm = findMember(data, mid); if (!fm) return;
  let f = null, cname = ''; fm.m.clients.forEach(c => c.funds.forEach(x => { if (x.id === fid) { f = x; cname = c.name; } })); if (!f) return;
  placeTip(row, `<h4>${ic('hash', 14)} Fund ${esc(f.fundId || '—')}</h4>
    <div class="tl">${ic('building', 12)} Client</div><div class="tv">${esc(cname)}</div>
    <div class="tl">${ic('users', 12)} Handled by</div><div class="tv">${esc(fm.m.name)} · ${STATUS[fm.m.status].short}</div>
    <div class="tl">${ic('globe', 12)} Countries serviced</div><div class="tv">${esc(f.countries.join(', ') || '—')}</div>
    <div class="tl">${ic('clock', 12)} Frequency</div><div class="tv">${esc(f.frequency || '—')}</div>
    <div class="tl">${ic('tag', 12)} Reports</div>${repChips(f, true)}`);
}
document.addEventListener('mouseover', e => {
  const l = e.target.closest('.leaf:not(.empty), .cc, .cf-row[data-tipfund]'); if (!l) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => l.classList.contains('cc') ? showClientTip(l) : l.dataset.tipfund ? showFundTip(l) : showTip(l), 150);
});
document.addEventListener('mouseout', e => { const l = e.target.closest('.leaf, .cc, .cf-row'); if (l && !l.contains(e.relatedTarget)) hideTip(); });
window.addEventListener('scroll', hideTip, true);

/* ===================== ACTIONS ===================== */
document.addEventListener('click', async e => {
  if (!e.target.closest('.ms')) document.querySelectorAll('.ms.open').forEach(x => x.classList.remove('open'));
  if (e.target === $('#modalWrap')) { closeModal(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case 'home': go('home'); break;
    case 'open-team': go(a.dataset.team); break;
    case 'toggle': e.stopPropagation(); ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); render(); break;
    case 'member': openDrawer(id, 'view'); break;
    case 'client-dl': downloadClientList(ui.page); break;
    case 'tview': ui.tview = a.dataset.v; ui.q = ''; render(); break;
    case 'client-view': {
      hideTip();
      ui.drawer = { mode: 'client', teamId: ui.page, key: a.dataset.key };
      renderDrawer(); $('#drawer').classList.add('show'); $('#scrim').classList.add('show'); $('#drawer').setAttribute('aria-hidden', 'false');
      break;
    }
    case 'edit': e.stopPropagation(); openDrawer(id, 'edit'); break;
    case 'client': hideTip(); openDrawer(id, 'view', a.dataset.cid); break;
    case 'status': {
      e.stopPropagation();
      const s = a.dataset.s, f = findMember(data, id);
      if (!f || f.m.status === s || !canEdit()) break;
      commit(d => { const x = findMember(d, id); if (x) { x.m.status = s; x.m.updatedAt = new Date().toISOString(); } }, `${f.m.name}: ${STATUS[s].label}`);
      break;
    }
    case 'add-member': if (canEdit()) openDrawer(null, 'edit', null, ui.page === 'home' ? CONFIG.teams[0].id : ui.page); break;
    case 'expand-all': {
      const t = team(data, ui.page); const all = t.members.every(m => ui.expanded.has(m.id));
      t.members.forEach(m => all ? ui.expanded.delete(m.id) : ui.expanded.add(m.id)); render(); break;
    }
    case 'close-drawer': closeDrawer(); break;
    case 'cancel-edit':
      if (ui.drawer.isNew) closeDrawer(); else { if (ui.drawer.dirty && !(await confirmBox('Discard changes?', 'Your unsaved edits will be lost.', 'Discard'))) break; ui.drawer = { id: ui.drawer.id, mode: 'view', teamId: ui.drawer.teamId }; renderDrawer(); }
      break;
    case 'add-client': {
      const c = newClient(); ui.drawer.draft.clients.push(c); ui.drawer.dirty = true; renderDrawer();
      setTimeout(() => { const i = document.querySelector(`[data-cf="name"][data-cid="${c.id}"]`); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); } }, 30);
      break;
    }
    case 'rm-client': ui.drawer.draft.clients = ui.drawer.draft.clients.filter(c => c.id !== a.dataset.cid); ui.drawer.dirty = true; renderDrawer(); break;
    case 'add-fund': {
      const c = draftClient(a.dataset.cid); const f = newFund(); c.funds.push(f); ui.drawer.dirty = true; renderDrawer();
      setTimeout(() => { const i = document.querySelector(`[data-ff="fundId"][data-fid="${f.id}"]`); if (i) i.focus(); }, 30);
      break;
    }
    case 'rm-fund': { const c = draftClient(a.dataset.cid); c.funds = c.funds.filter(f => f.id !== a.dataset.fid); ui.drawer.dirty = true; renderDrawer(); break; }
    case 'ms-toggle': { const ms = a.closest('.ms'); const was = ms.classList.contains('open'); document.querySelectorAll('.ms.open').forEach(x => x.classList.remove('open')); if (!was) ms.classList.add('open'); break; }
    case 'ms-add': if (canEdit()) msAdd(a.dataset.kind, a.dataset.cid, a.dataset.fid); break;
    case 'save-member': saveMember(); break;
    case 'del-member': {
      const D = ui.drawer, name = D.draft.name;
      if (!(await confirmBox(`Remove ${name}?`, 'This removes the member and all their client assignments.', 'Remove'))) break;
      const mid = D.draft.id;
      commit(d => d.teams.forEach(t => t.members = t.members.filter(m => m.id !== mid)), `${name} removed`);
      closeDrawer(true); break;
    }
    case 'report': openReport(a.dataset.team); break;
    case 'rep-tab': ui.rep.tab = a.dataset.v; renderRepTools(); renderRepTable(); break;
    case 'excel': downloadExcel(); break;
    case 'print': window.print(); break;
    case 'settings': openSettings(); break;
    case 'close-modal': closeModal(); break;
    case 'settings-add-country': {
      const v = $('#s-newcountry').value.trim(); if (!v || !canEdit()) break;
      if (data.countries.some(x => x.toLowerCase() === v.toLowerCase())) { toast('That country already exists', true); break; }
      addToList('ctry', v); openSettings(); break;
    }
    case 'settings-add-type': {
      const v = $('#s-newtype').value.trim(); if (!v || !canEdit()) break;
      if (data.reportTypes.some(x => x.toLowerCase() === v.toLowerCase())) { toast('That report type already exists', true); break; }
      commit(d => { if (!d.reportTypes.some(x => x.toLowerCase() === v.toLowerCase())) d.reportTypes.push(v); }, `Report type "${v}" added`);
      openSettings(); break;
    }
    case 'refresh': if (mode() === 'local') { toast('Not connected — open Settings to connect'); } else await pull(true); break;
    case 'lock': lockNow(); break;
    case 'sync-setup': openSyncSetup(); break;
    case 'gen-key': genTeamKey(); break;
    case 'copy-key': { const t = $('#k-code'); t.select(); try { await navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } toast('Copied — paste it into index.html'); break; }
    case 'save-name': { session.name = clean($('#s-name').value, 60); localStorage.setItem(K.name, session.name); toast('Name saved'); break; }
    case 'activity': openActivity(); break;
    case 'forget': {
      if (!(await confirmBox('Forget this device?', 'Removes your saved access key and the encrypted copy of the data from this browser. Team data on GitHub is not affected.', 'Forget'))) break;
      [K.vault, K.cache, K.conn, K.fail, K.teamKey, K.name].forEach(k => localStorage.removeItem(k)); pending = []; location.hash = '#/'; location.reload(); break;
    }
    case 'export': {
      const u = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), l = document.createElement('a');
      l.href = u; l.download = `GMK-WorkBoard-backup-${new Date().toISOString().slice(0, 10)}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      break;
    }
    case 'import': $('#importFile').click(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.querySelector('.ms.open')) document.querySelectorAll('.ms.open').forEach(x => x.classList.remove('open')); else if ($('#modalWrap').classList.contains('show')) closeModal(); else if (ui.drawer) closeDrawer(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.newval) { e.preventDefault(); const b = e.target.parentElement.querySelector('[data-act="ms-add"]'); if (b) b.click(); }
});

/* ===================== LOCK SCREEN ===================== */
let pin = '';
function buildKeypad() {
  $('#keypad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k =>
    k === '' ? '<span class="key blank"></span>' : `<button class="key" data-k="${k}">${k === '⌫' ? ic('back', 20) : k}</button>`).join('');
  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
}
function press(k) {
  if ($('#lock').classList.contains('out')) return;
  if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  $('#lockMsg').textContent = '';
  const dots = $('#pinDots'); dots.classList.remove('err');
  [...dots.children].forEach((s, i) => s.classList.toggle('on', i < pin.length));
  if (pin.length === 4) setTimeout(checkPin, 120);
}
const failState = () => lsGet(K.fail, { n: 0, until: 0 });
function resetPin(msg, err) {
  const dots = $('#pinDots'), card = $('#lockCard');
  if (err) { dots.classList.add('err'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  $('#lockMsg').textContent = msg || '';
  setTimeout(() => { pin = ''; dots.classList.remove('err'); [...dots.children].forEach(s => s.classList.remove('on')); busy = false; }, 500);
}
let busy = false;
async function checkPin() {
  if (busy) return; busy = true;
  const p = pin, f0 = failState();
  if (f0.until > Date.now()) { resetPin(`Too many attempts. Try again in ${Math.ceil((f0.until - Date.now()) / 1000)} s.`, true); return; }
  if (!window.crypto || !crypto.subtle) { resetPin('Secure mode needs the https:// link (or a modern browser).', true); return; }
  $('#lockMsg').style.color = 'var(--muted)'; $('#lockMsg').textContent = 'Verifying…';
  let ok = false;
  try {
    let salt = localStorage.getItem(K.salt);
    if (!salt) { salt = toB64(crypto.getRandomValues(new Uint8Array(16))); localStorage.setItem(K.salt, salt); }
    const key = await deriveKey(p, salt);
    const code = CONFIG.teamKey || localStorage.getItem(K.teamKey);
    if (code) { try { const t = await openTeamKey(p, code); session.token = t.t; session.conn = { owner: t.owner, repo: t.repo, branch: t.branch, path: t.path }; ok = true; } catch (e) { ok = false; } }
    if (!ok && (await sha256hex('gmk-workboard:' + p)) === CONFIG.pinHash) ok = true;
    if (ok) { session.key = key; session.pin = p; }
  } catch (e) { ok = false; }
  $('#lockMsg').style.color = '';
  if (ok) { lsSet(K.fail, { n: 0, until: 0 }); pin = ''; await afterUnlock(); return; }
  const f = failState(); f.n++;
  if (f.n % CONFIG.maxAttempts === 0) f.until = Date.now() + 60000 * Math.pow(2, f.n / CONFIG.maxAttempts - 1);
  lsSet(K.fail, f);
  resetPin(f.until > Date.now() ? `Too many attempts. Locked for ${Math.round((f.until - Date.now()) / 60000)} min.` : `Incorrect PIN. ${CONFIG.maxAttempts - (f.n % CONFIG.maxAttempts)} attempt(s) left.`, true);
}
async function afterUnlock() {
  const cache = lsGet(K.cache, null);
  if (cache) { try { data = normalize(await unseal(session.key, cache)); } catch (e) {} }
  // migrate & wipe any plain-text data left by older versions
  const legacy = lsGet(K.legacyData, null), legacyGh = lsGet(K.legacyGh, null);
  if (legacy && !cache) data = normalize(legacy);
  [K.legacyData, K.legacyGh, K.vault, K.conn].forEach(k => localStorage.removeItem(k)); sessionStorage.removeItem(K.legacyUnlock);
  session.name = clean(localStorage.getItem(K.name), 60);
  saveLocal();
  unlock();
  if (!session.token) setTimeout(() => toast('Team sync is not set up yet — changes stay on this device (Settings → Team sync setup)', true), 600);
}
let lastActive = Date.now();
['pointermove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true, capture: true }));
async function lockNow() {
  if (pending.length && mode() === 'live') { toast('Saving your changes before locking…'); try { await doSync(); } catch (e) {} }
  session.key = null; session.token = ''; session.pin = ''; session.conn = null; data = normalize(emptyData());
  location.hash = '#/'; location.reload();
}
document.addEventListener('keydown', e => {
  if ($('#lock').classList.contains('out')) return;
  if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫');
});
function unlock() {
  $('#lock').classList.add('out'); setTimeout(() => $('#lock').classList.add('hidden'), 350);
  $('#app').classList.remove('hidden');
  startApp();
}

/* ===================== START ===================== */
let started = false;
function startApp() {
  if (started) return; started = true;
  routeFromHash(); render();
  setSync(mode() === 'local' ? 'local' : 'synced');
  setInterval(() => { if (session.key && Date.now() - lastActive > CONFIG.autoLockMinutes * 60000) lockNow(); }, 20000);
  if (mode() !== 'local') pull(true, true);
  setInterval(() => pull(false), CONFIG.pollSeconds * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(false); });
}
paintIcons();
buildKeypad();
if (window.top !== window.self) { try { window.top.location = window.self.location.href; } catch (e) { document.body.innerHTML = ''; } }   // anti-clickjacking
</script>
